[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kcs-control-plane-backend"
version = "0.1.0"
description = "FastAPI control-plane backend bootstrap."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "mcp>=1.2,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]
# Duplicate-retrieval evaluation via the shared, backend-agnostic relevance-eval
# skill (Precision@k / MRR@k / nDCG@k). Installed on demand for the run-locally
# eval; not required for the app or the offline test gate.
eval = [
  "relevance-eval @ git+https://github.com/esterkane/elastic-ai-search-decision-lab.git@main#subdirectory=skills/relevance-eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
